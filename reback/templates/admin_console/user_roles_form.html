{% extends "layout_vertical.html" %}
{% load crispy_forms_tags i18n %}

{% block title %}Edit User Roles{% endblock %}

{% block page_title %}
  <div class="row py-3">
    <div class="col"><h3 class="mb-0">Edit roles for {{ user.name|default:user.email }}</h3></div>
  </div>
{% endblock %}

{% block page_content %}
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'admin_console:users_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
