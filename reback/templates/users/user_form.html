{% extends "layout_vertical.html" %}

{% load crispy_forms_tags %}

{% block title %}Edit Profile{% endblock title %}

{% block page_title %}
  <div class="row py-3"><div class="col"><h2 class="mb-0">Edit Profile</h2></div></div>
{% endblock %}

{% block page_content %}
  <div class="card">
    <div class="card-body">
      <form class="form-horizontal"
            method="post"
            enctype="multipart/form-data"
            action="{% url 'users:update' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="control-group">
          <div class="controls">
            <button type="submit" class="btn btn-primary">Update</button>
          </div>
        </div>

        {% if user.avatar %}
        <div class="mt-3">
          <p>Current avatar:</p>
          <img src="{{ user.avatar.url }}" alt="avatar" class="img-thumbnail" style="max-width: 120px;" />
        </div>
        {% endif %}
      </form>
    </div>
  </div>
{% endblock %}
